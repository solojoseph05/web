name: CI/CD Deploy & Build Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Verify Deployment
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, pdo_mysql, bcmath, curl
          coverage: none

      - name: 📦 Install Composer Dependencies & Run Migrations
        run: |
          if [ -d "backend" ] && [ -f "backend/artisan" ]; then
            cd backend
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan key:generate --force
            touch database/database.sqlite
            php artisan migrate --force
            cd ..
          elif [ -f "artisan" ]; then
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan key:generate --force
            touch database/database.sqlite
            php artisan migrate --force
          fi

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install --ignore-scripts

      - name: 🚀 Run Deployment Script (Migrations & Frontend Build)
        run: |
          chmod +x deploy.sh
          bash deploy.sh

      - name: 📋 Verify Build Artifacts
        run: |
          echo "Verificando carpeta dist/"
          ls -la dist/
