<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#ffffff" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pollo Feliz | El Mejor Pollo Asado al Carbón</title>
    <meta name="description" content="Sitio web y panel administrativo de Pollo Feliz" />
    <meta property="og:title" content="Pollo Feliz" />
    <meta property="og:description" content="Sitio web y panel administrativo de Pollo Feliz" />

    <script>
      // Gracefully prevent and silence Vite HMR WebSocket connection errors in preview environments
      (function () {
        var origError = console.error;
        console.error = function () {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('failed to connect to websocket') ||
            msg.includes('[vite]') ||
            msg.includes('createWebSocketModuleRunnerTransport')
          ) {
            return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function () {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('failed to connect to websocket') ||
            msg.includes('[vite]')
          ) {
            return;
          }
          origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function (e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason && (e.reason.message || String(e.reason));
          if (reason && (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
